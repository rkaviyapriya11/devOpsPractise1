name: Node Basic pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node:
    runs-on: wsl-linux
    strategy:
     matrix:
       node-version: [24,26]
    
    steps:
      - name: Code clone
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
           node-version: ${{ matrix.node-version }}
      - name: install dependencies
        run: npm install
        
      - name: Create .env file
        run: | 
          echo "PORT=8080" >> .env.development
          echo "APP=GHA-NODE-DEV-APP" >> .env.development
          echo "PORT+5000" >> .env.production
          echo "APP=GHA-NODE-PROD-APP" >> .env.production
          
      - name: Run application
        run: |
          node app.js &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/health
          pkill -f "node app.js"
