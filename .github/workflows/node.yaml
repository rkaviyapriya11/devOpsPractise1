name: Node Basic pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node:
    runs-on: wsl-linux
    
    steps:
      - name: Code clone
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
           node-version: 24
      - name: install dependencies
        run: npm install

      - name: Run application
        run: |
          node app.js &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/health
          pkill -f "node app.js"
